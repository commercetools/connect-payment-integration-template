version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/processor"
    # Patch and minor are deliberately separate groups: patch-only PRs are
    # auto-merged (see .github/workflows/dependabot-auto-merge.yml), and for a
    # grouped PR Dependabot reports the *highest* bump in the group - so mixing
    # minor in would block every patch from ever auto-merging.
    groups:
      patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
    ignore:
      # Keep @types/node on the same major as the Node runtime (24.x, see .nvmrc).
      # The groups above only cover minor/patch, so majors still arrive as their
      # own PRs - that is how @types/node previously drifted to 26.x.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # ts-jest 29.4.12 (latest) peer-requires typescript ">=4.3 <7", and its
      # transpiler hardcodes require("typescript"), which TS 7's native compiler
      # cannot satisfy - the test suites fail to run. 6.x is fine, so only pin
      # out 7+; drop this once ts-jest ships TypeScript 7 support.
      - dependency-name: "typescript"
        versions: [">=7"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/enabler"
    groups:
      patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
    ignore:
      # Keep @types/node on the same major as the Node runtime (24.x, see .nvmrc).
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # ts-jest 29.4.12 (latest) peer-requires typescript ">=4.3 <7", and its
      # transpiler hardcodes require("typescript"), which TS 7's native compiler
      # cannot satisfy - the test suites fail to run. 6.x is fine, so only pin
      # out 7+; drop this once ts-jest ships TypeScript 7 support.
      - dependency-name: "typescript"
        versions: [">=7"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
