version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/processor"
    # Patch and minor are deliberately separate groups: for a grouped PR
    # Dependabot reports the *highest* bump in the group, so mixing minor in
    # would leave low-risk patch bumps waiting on a minor-bump review.
    groups:
      patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
    ignore:
      # Keep @types/node on the same major as the Node runtime (24.x, see .nvmrc).
      # The groups above only cover minor/patch, so majors still arrive as their
      # own PRs - that is how @types/node previously drifted to 26.x.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # @typescript-eslint/parser peer-requires typescript ">=4.8.4 <6.1.0";
      # pin out 7+ here so a major TypeScript bump surfaces as a reviewable
      # PR instead of silently breaking eslint/type-check in CI.
      - dependency-name: "typescript"
        versions: [">=7"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/enabler"
    groups:
      patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
    ignore:
      # Keep @types/node on the same major as the Node runtime (24.x, see .nvmrc).
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Mirror the processor's pin: hold off TypeScript 7+ here too until the
      # shared toolchain across both packages has been verified against it.
      - dependency-name: "typescript"
        versions: [">=7"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    # Actions are declared in .github/workflows, but Dependabot expects the
    # repository root here - "/.github/workflows" silently matches nothing.
    directory: "/"
    # The workflows pin actions to a commit SHA with a trailing "# vX.Y.Z"
    # comment. Dependabot reads that comment to work out the semver bump and
    # rewrites both the SHA and the comment, so pinning does not opt out of
    # updates - it is what makes them reviewable.
    #
    # Same patch/minor split as the npm entries above, and for the same reason:
    # a grouped PR reports the highest bump in the group, so mixing minor in
    # would leave low-risk patch bumps waiting on a minor-bump review.
    groups:
      patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
