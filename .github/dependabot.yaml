version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/processor"
    # Patch and minor are deliberately separate groups: for a grouped PR
    # Dependabot reports the *highest* bump in the group, so mixing minor in
    # would leave low-risk patch bumps waiting on a minor-bump review.
    groups:
      patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
    ignore:
      # Keep @types/node on the same major as the Node runtime (24.x, see .nvmrc).
      # The groups above only cover minor/patch, so majors still arrive as their
      # own PRs - that is how @types/node previously drifted to 26.x.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # ts-jest 29.4.12 (latest) peer-requires typescript ">=4.3 <7", and its
      # transpiler hardcodes require("typescript"), which TS 7's native compiler
      # cannot satisfy - the test suites fail to run. 6.x is fine, so only pin
      # out 7+; drop this once ts-jest ships TypeScript 7 support.
      - dependency-name: "typescript"
        versions: [">=7"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/enabler"
    groups:
      patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
    ignore:
      # Keep @types/node on the same major as the Node runtime (24.x, see .nvmrc).
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # ts-jest 29.4.12 (latest) peer-requires typescript ">=4.3 <7", and its
      # transpiler hardcodes require("typescript"), which TS 7's native compiler
      # cannot satisfy - the test suites fail to run. 6.x is fine, so only pin
      # out 7+; drop this once ts-jest ships TypeScript 7 support.
      - dependency-name: "typescript"
        versions: [">=7"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    # Actions are declared in .github/workflows, but Dependabot expects the
    # repository root here - "/.github/workflows" silently matches nothing.
    directory: "/"
    # The workflows pin actions to a commit SHA with a trailing "# vX.Y.Z"
    # comment. Dependabot reads that comment to work out the semver bump and
    # rewrites both the SHA and the comment, so pinning does not opt out of
    # updates - it just makes them reviewable.
    #
    # Same patch/minor split as the npm entries above, and for the same reason:
    # a grouped PR reports the highest bump in the group, so mixing minor in
    # would leave low-risk patch bumps waiting on a minor-bump review.
    groups:
      patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
