version: "3.8"

services:
  jwt-server:
    build: ./docker-dev/jwt-mock
    restart: always
    ports:
      - 9002:9002

  enabler:
    image: node:24
    volumes:
      - ./enabler:/home/node/app
    restart: always
    working_dir: /home/node/app
    depends_on:
      - processor
    command:  /bin/sh -c 'npm install && npm run dev -- --host 0.0.0.0 --port 3000'
    env_file:
      - ./enabler/.env
    environment:
      - VITE_PROCESSOR_URL=http://localhost:8080
    ports:
      - 3000:3000
  
  processor:
    image: node:24
    volumes:
      - ./processor:/home/node/app
    working_dir: /home/node/app
    depends_on:
      - jwt-server
    env_file:
      - ./processor/.env
    environment:
      - CTP_JWKS_URL=http://jwt-server:9002/jwt/.well-known/jwks.json
      - CTP_JWT_ISSUER=https://issuer.com
    command: /bin/sh -c 'npm install && npm run watch'
    ports:
      - 8080:8080
